<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calculadora préstamo vehículo RD | CalculaRD</title>
    <meta name="description" content="Calcula la cuota de financiamiento de un vehículo en RD con inicial, tasa y plazo.">
    <meta name="theme-color" content="#0d1117">
    <meta property="og:title" content="Calculadora préstamo vehículo RD">
    <meta property="og:description" content="Estima cuota mensual, intereses y total de un financiamiento de vehículo.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="/og-image.svg">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="canonical" href="https://calculard.com/vehiculos.html">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <nav class="nav" aria-label="Principal">
        <a class="brand" href="/">
          <span class="brand-mark">RD</span>
          <span>CalculaRD</span>
        </a>
        <div class="nav-links">
          <a href="/prestamos.html">Préstamos</a>
          <a href="/itbis.html">ITBIS</a>
          <a href="/sueldo.html">Sueldo</a>
          <a href="/vehiculos.html">Vehículos</a>
        </div>
      </nav>
    </header>
    <main>
      <section class="page-intro">
        <p class="eyebrow">Calculadora vehículos RD</p>
        <h1>Calcula la cuota de tu vehículo.</h1>
        <p>Introduce precio, inicial, tasa y plazo para estimar la cuota mensual.</p>
      </section>
      <section class="single-calculator">
        <article class="calculator-card" id="vehiculos">
          <div class="card-heading">
            <p>Vehículos</p>
            <h2>Financiamiento de auto</h2>
          </div>
          <form class="calc-form" data-calculator="vehicle">
            <label>
              <span>Precio del vehículo</span>
              <input name="price" type="number" min="0" step="5000" value="1500000">
            </label>
            <label>
              <span>Inicial</span>
              <input name="downPayment" type="number" min="0" step="5000" value="300000">
            </label>
            <label>
              <span>Tasa anual (%)</span>
              <input name="rate" type="number" min="0" step="0.01" value="14">
            </label>
            <label>
              <span>Plazo en años</span>
              <input name="years" type="number" min="1" max="10" step="1" value="5">
            </label>
          </form>
          <div class="results" data-results="vehicle"></div>
        </article>
      </section>
    </main>
    <footer class="site-footer">
      <p>Cálculo estimado. Valida condiciones finales con el dealer o entidad financiera.</p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
